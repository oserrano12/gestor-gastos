<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans leading-normal tracking-normal text-slate-800">
    
    <!-- Navbar -->
    <nav class="bg-blue-700 p-4 shadow-lg text-white">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> Gestor Financiero
            </h1>
            <div>
                <button id="btnInstalar" class="hidden bg-white text-blue-700 px-4 py-1 rounded shadow text-sm font-semibold hover:bg-blue-50">
                    Instalar App
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Columna Izquierda: Formulario de Crédito -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-lg font-bold mb-4 text-slate-700 border-b pb-2">
                    <i class="fa-solid fa-credit-card mr-2 text-blue-500"></i> Registrar Nuevo Crédito
                </h2>
                
                <form id="formCredito" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase">Concepto (Ej: Computador)</label>
                        <input type="text" id="concepto" required class="mt-1 block w-full rounded border-slate-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 p-2 border">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase">Monto Total ($)</label>
                        <input type="number" id="monto_total" step="0.01" required class="mt-1 block w-full rounded border-slate-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 p-2 border">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Tasa de Interés (%)</label>
                            <!-- El usuario ingresa 2.15 para 2.15%, el JS lo divide por 100 -->
                            <input type="number" id="tasa_interes" step="0.0001" required class="mt-1 block w-full rounded border-slate-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 p-2 border" placeholder="Ej: 2.15">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Tipo de Tasa</label>
                            <select id="tipo_tasa" class="mt-1 block w-full rounded border-slate-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 p-2 border bg-white">
                                <option value="MV">Mes Vencido (MV)</option>
                                <option value="EA">Efectiva Anual (EA)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase">N° Cuotas</label>
                            <input type="number" id="numero_cuotas" required min="1" class="mt-1 block w-full rounded border-slate-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 p-2 border">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase">Fecha Compra</label>
                            <input type="date" id="fecha_compra" required class="mt-1 block w-full rounded border-slate-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 p-2 border text-sm">
                        </div>
                    </div>

                    <!-- Entidad Oculta por simplicidad (se auto-creará en JS) -->
                    <input type="hidden" id="entidad_id" value="1">

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow mt-4 transition-colors">
                        Calcular y Guardar
                    </button>
                </form>
            </div>
        </div>

        <!-- Columna Derecha: Cuotas Pendientes -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-md p-6 h-full">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold text-slate-700">
                        <i class="fa-solid fa-calendar-days mr-2 text-blue-500"></i> Cuotas Pendientes de Pago
                    </h2>
                    <button onclick="cargarCuotas()" class="text-blue-500 hover:text-blue-700" title="Actualizar">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200 text-sm">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-4 py-3 text-left font-semibold text-slate-500 uppercase">Fecha Venc.</th>
                                <th class="px-4 py-3 text-left font-semibold text-slate-500 uppercase">Cuota #</th>
                                <th class="px-4 py-3 text-right font-semibold text-slate-500 uppercase">Capital</th>
                                <th class="px-4 py-3 text-right font-semibold text-slate-500 uppercase">Interés</th>
                                <th class="px-4 py-3 text-right font-semibold text-slate-500 uppercase">Total a Pagar</th>
                                <th class="px-4 py-3 text-center font-semibold text-slate-500 uppercase">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuotas" class="bg-white divide-y divide-slate-100">
                            <!-- Inyectado por JS -->
                            <tr>
                                <td colspan="6" class="px-4 py-8 text-center text-slate-400">
                                    Cargando cuotas...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de lógica -->
    <script src="app.js"></script>
</body>
</html>
